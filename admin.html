<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ANIZZZY — Admin Panel</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  background:#f2f2f2;
  color:#111;
  padding-bottom:40px;
}

header{
  background:#080808;
  color:white;
  padding:18px 20px;
  text-align:center;
  font-size:20px;
  letter-spacing:3px;
  font-weight:bold;
}

.lock-screen{
  min-height:80vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:20px;
  text-align:center;
}

.lock-screen input{
  width:100%;
  max-width:300px;
  padding:14px;
  border-radius:10px;
  border:1px solid #ccc;
  font-size:16px;
  margin:15px 0;
}

.lock-screen button{
  background:#111;
  color:white;
  border:0;
  padding:14px 30px;
  border-radius:25px;
  font-weight:bold;
  cursor:pointer;
  font-size:15px;
}

.error-txt{
  color:#e53935;
  font-size:13px;
  margin-top:5px;
}

.hidden{
  display:none !important;
}

.container{
  max-width:600px;
  margin:0 auto;
  padding:20px 15px;
}

.card{
  background:white;
  border-radius:14px;
  padding:20px;
  box-shadow:0 2px 10px #ddd;
  margin-bottom:20px;
}

.card h2{
  margin-bottom:15px;
  font-size:18px;
}

label{
  display:block;
  font-size:13px;
  font-weight:bold;
  margin:12px 0 5px;
  color:#444;
}

input[type="text"],
input[type="number"],
input[type="url"]{
  width:100%;
  padding:12px;
  border-radius:8px;
  border:1px solid #ccc;
  font-size:15px;
}

.preview-img{
  width:100%;
  max-height:180px;
  object-fit:cover;
  border-radius:10px;
  margin-top:10px;
  display:none;
  background:#eee;
}

.submit-btn{
  width:100%;
  background:#111;
  color:white;
  border:0;
  padding:14px;
  border-radius:8px;
  font-weight:bold;
  font-size:15px;
  margin-top:18px;
  cursor:pointer;
}

.submit-btn:disabled{
  opacity:0.5;
}

.status-msg{
  text-align:center;
  padding:10px;
  border-radius:8px;
  margin-top:12px;
  font-size:14px;
  display:none;
}

.status-msg.success{
  background:#e6f7ec;
  color:#1b8a4c;
  display:block;
}

.status-msg.error{
  background:#fdeaea;
  color:#c62828;
  display:block;
}

.product-list-item{
  display:flex;
  gap:12px;
  align-items:center;
  padding:12px 0;
  border-bottom:1px solid #eee;
}

.product-list-item:last-child{
  border-bottom:0;
}

.product-list-item img{
  width:55px;
  height:55px;
  object-fit:cover;
  border-radius:8px;
  background:#eee;
  flex-shrink:0;
}

.pli-info{
  flex:1;
  min-width:0;
}

.pli-info h4{
  font-size:14px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.pli-info span{
  font-size:13px;
  color:#666;
}

.pli-actions{
  display:flex;
  gap:8px;
}

.pli-actions button{
  border:0;
  padding:8px 12px;
  border-radius:6px;
  font-size:13px;
  cursor:pointer;
}

.btn-edit{
  background:#eef2ff;
  color:#3949ab;
}

.btn-delete{
  background:#fdeaea;
  color:#c62828;
}

.empty-list{
  text-align:center;
  color:#888;
  padding:20px;
  font-size:14px;
}

.logout-btn{
  text-align:center;
  margin-top:10px;
}

.logout-btn a{
  color:#c62828;
  font-size:13px;
  text-decoration:underline;
  cursor:pointer;
}
</style>
</head>

<body>

<header>ANIZZZY ADMIN</header>

<div class="lock-screen" id="lockScreen">
  <h2>🔒 Admin Login</h2>
  <input type="text" id="pinInput" placeholder="Enter admin password">
  <button onclick="checkPin()">Unlock</button>
  <div class="error-txt" id="pinError"></div>
</div>

<div class="container hidden" id="adminPanel">

  <div class="card">
    <h2 id="formTitle">Add New Product</h2>

    <label>Product Name</label>
    <input type="text" id="pName" placeholder="e.g. Premium Heels">

    <label>Price (₹)</label>
    <input type="number" id="pPrice" placeholder="e.g. 999">

    <label>Image URL</label>
    <input type="url" id="pImage" placeholder="https://..." oninput="previewImage()">
    <img id="imgPreview" class="preview-img">

    <button class="submit-btn" id="submitBtn" onclick="saveProduct()">Add Product</button>
    <button class="submit-btn hidden" id="cancelEditBtn" style="background:#888;margin-top:8px;" onclick="cancelEdit()">Cancel Edit</button>

    <div class="status-msg" id="statusMsg"></div>
  </div>

  <div class="card">
    <h2>Current Products</h2>
    <div id="productList">
      <div class="empty-list">Loading...</div>
    </div>
  </div>

  <div class="logout-btn">
    <a onclick="logout()">Lock admin panel</a>
  </div>

  </div><script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import {
    getFirestore,
    collection,
    getDocs,
    addDoc,
    updateDoc,
    deleteDoc,
    doc,
    query,
    orderBy,
    serverTimestamp
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDAo5sQs_L-Jele0PTPS9EK4Iv5yNqoBtk",
    authDomain: "anixzzy-store.firebaseapp.com",
    projectId: "anixzzy-store",
    storageBucket: "anixzzy-store.firebasestorage.app",
    messagingSenderId: "1048658919986",
    appId: "1:1048658919986:web:3e2b2518de044174bbf22b",
    measurementId: "G-VY1DY7GRMF"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  const ADMIN_PASSWORD = "anizzzy2026";

  let editingId = null;

  window.checkPin = function(){
    const val = document.getElementById("pinInput").value;
    if (val === ADMIN_PASSWORD) {
      document.getElementById("lockScreen").classList.add("hidden");
      document.getElementById("adminPanel").classList.remove("hidden");
      sessionStorage.setItem("anizzzy_admin", "1");
      loadProductList();
    } else {
      document.getElementById("pinError").textContent = "Wrong password, try again.";
    }
  };

  window.logout = function(){
    sessionStorage.removeItem("anizzzy_admin");
    location.reload();
  };

  if (sessionStorage.getItem("anizzzy_admin") === "1") {
    document.getElementById("lockScreen").classList.add("hidden");
    document.getElementById("adminPanel").classList.remove("hidden");
    loadProductList();
  }

  window.previewImage = function(){
    const url = document.getElementById("pImage").value;
    const img = document.getElementById("imgPreview");
    if (url) {
      img.src = url;
      img.style.display = "block";
    } else {
      img.style.display = "none";
    }
  };

  function showStatus(msg, isError){
    const el = document.getElementById("statusMsg");
    el.textContent = msg;
    el.className = "status-msg " + (isError ? "error" : "success");
    setTimeout(() => { el.className = "status-msg"; }, 3000);
  }

  window.saveProduct = async function(){
    const name = document.getElementById("pName").value.trim();
    const price = document.getElementById("pPrice").value.trim();
    const image = document.getElementById("pImage").value.trim();

    if (!name || !price || !image) {
      showStatus("Please fill all fields.", true);
      return;
    }

    const btn = document.getElementById("submitBtn");
    btn.disabled = true;

    try {
      if (editingId) {
        await updateDoc(doc(db, "products", editingId), {
          name, price, image
        });
        showStatus("Product updated!", false);
      } else {
        await addDoc(collection(db, "products"), {
          name, price, image,
          createdAt: serverTimestamp()
        });
        showStatus("Product added!", false);
      }

      resetForm();
      loadProductList();

    } catch (err) {
      console.error(err);
      showStatus("Error saving product.", true);
    }

    btn.disabled = false;
  };

  function resetForm(){
    document.getElementById("pName").value = "";
    document.getElementById("pPrice").value = "";
    document.getElementById("pImage").value = "";
    document.getElementById("imgPreview").style.display = "none";
    editingId = null;
    document.getElementById("formTitle").textContent = "Add New Product";
    document.getElementById("submitBtn").textContent = "Add Product";
    document.getElementById("cancelEditBtn").classList.add("hidden");
  }

  window.cancelEdit = function(){
    resetForm();
  };

  window.editProduct = function(id, name, price, image){
    editingId = id;
    document.getElementById("pName").value = name;
    document.getElementById("pPrice").value = price;
    document.getElementById("pImage").value = image;
    previewImage();
    document.getElementById("formTitle").textContent = "Edit Product";
    document.getElementById("submitBtn").textContent = "Update Product";
    document.getElementById("cancelEditBtn").classList.remove("hidden");
    window.scrollTo({top:0, behavior:"smooth"});
  };

  window.deleteProduct = async function(id){
    if (!confirm("Delete this product?")) return;
    try {
      await deleteDoc(doc(db, "products", id));
      loadProductList();
    } catch (err) {
      console.error(err);
      alert("Error deleting product.");
    }
  };

  async function loadProductList(){
    const list = document.getElementById("productList");
    try {
      const q = query(collection(db, "products"), orderBy("createdAt", "desc"));
      const snapshot = await getDocs(q);

      if (snapshot.empty) {
        list.innerHTML = '<div class="empty-list">No products yet. Add your first one above!</div>';
        return;
      }

      list.innerHTML = "";
      snapshot.forEach((docSnap) => {
        const p = docSnap.data();
        const safeName = (p.name || "").replace(/"/g, "&quot;");
        const safeImage = (p.image || "").replace(/"/g, "&quot;");

        const item = document.createElement("div");
        item.className = "product-list-item";
        item.innerHTML = `
          <img src="${p.image || ''}" alt="">
          <div class="pli-info">
            <h4>${p.name || "Unnamed"}</h4>
            <span>₹${p.price || "0"}</span>
          </div>
          <div class="pli-actions">
            <button class="btn-edit" onclick="editProduct('${docSnap.id}','${safeName}','${p.price || ''}','${safeImage}')">Edit</button>
            <button class="btn-delete" onclick="deleteProduct('${docSnap.id}')">Delete</button>
          </div>
        `;
        list.appendChild(item);
      });

    } catch (err) {
      console.error(err);
      list.innerHTML = '<div class="empty-list">Error loading products.</div>';
    }
  }
</script>

</body>
</html>
